<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="voice-loop">
<meta name="theme-color" content="#111111">
<!-- アイコンは spike/make_icon.py で作る（自分の画像に替えるときも同じスクリプトに渡す） -->
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>voice-loop</title>
<style>
  :root { --bg:#111; --fg:#eee; --mute:#888; --rec:#e0443e; --ok:#3ea66b; --btn:#2a2a2a; --me:#1f3a5f; --ai:#1e1e1e; --line:#2f2f2f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system, "Hiragino Sans", sans-serif; display:flex; flex-direction:column; height:100dvh; }
  button, select { touch-action: manipulation; }
  #log { flex:1; overflow-y:auto; padding:12px 12px 4px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .msg { max-width:94%; padding:10px 12px; border-radius:14px; word-break:break-word; }
  .msg.me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; white-space:pre-wrap; }
  .msg.ai { align-self:flex-start; background:var(--ai); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.ai.speaking { border-color: var(--ok); }
  .flash { outline:2px solid var(--ok); outline-offset:2px; } /* 件の URL で開いた問い・報告 */
  #topicMsg { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mute); padding:2px 4px; }
  #topicMsg[hidden] { display:none; }
  #topicMsg span { flex:1; min-width:0; overflow-wrap:anywhere; }
  #topicMsg button { background:none; border:none; color:inherit; font-size:14px; cursor:pointer; }
  .msg.pending { opacity:.6; }
  .sys { align-self:center; color:var(--mute); font-size:12px; text-align:center; }
  .msg .rep { display:flex; align-items:center; gap:8px; margin:0 0 6px; font-size:12px; color:var(--mute); white-space:normal; }
  .msg .rep .about { overflow-wrap:anywhere; }
  .msg .rep button { flex:none; border:1px solid #3a3a3a; border-radius:12px; background:none; color:inherit; font-size:12px; line-height:1; padding:4px 9px; }
  #replyBar { align-items:center; gap:8px; font-size:12px; color:var(--mute); }
  #replyBar:not([hidden]) { display:flex; }
  #replyBar #replyTo { flex:1; overflow-wrap:anywhere; }
  #replyBar button { flex:none; border:1px solid #3a3a3a; border-radius:12px; background:none; color:inherit; font-size:12px; line-height:1; padding:4px 9px; }
  /* エージェントの返信（Markdown） */
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p { margin:.5em 0; }
  .md h1, .md h2, .md h3, .md h4 { margin:.9em 0 .4em; line-height:1.35; }
  .md h1 { font-size:1.2em; } .md h2 { font-size:1.1em; } .md h3, .md h4 { font-size:1em; }
  .md ul, .md ol { margin:.4em 0; padding-left:1.4em; }
  .md li { margin:.15em 0; }
  .md code { font:13px/1.5 ui-monospace, Menlo, monospace; background:#2b2b2b; padding:.1em .35em; border-radius:4px; }
  .md pre { background:#0b0b0b; border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; margin:.6em 0; }
  .md pre code { background:none; padding:0; }
  .md .tw { overflow-x:auto; margin:.6em 0; }
  .md table { border-collapse:collapse; font-size:14px; }
  .md th, .md td { border:1px solid #3a3a3a; padding:4px 8px; text-align:left; vertical-align:top; }
  .md th { background:#262626; }
  .md blockquote { margin:.5em 0; padding-left:.8em; border-left:3px solid #444; color:#bbb; }
  .md hr { border:none; border-top:1px solid var(--line); margin:.8em 0; }
  .md a { color:#7fb4ff; }
  #bar { flex:none; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); background:#161616; border-top:1px solid #262626; display:flex; flex-direction:column; gap:8px; }
  #status { color:var(--mute); font-size:13px; min-height:1.6em; display:flex; align-items:center; gap:6px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mute); flex:none; }
  .dot.on { background:var(--ok); }
  #statusText { flex:1; min-width:0; }
  /* 顔の表示へ（ふつうのリンク。⌘・中ボタンで押せば、この画面を残して別のタブで開く）。↻ と同じく目立たないように */
  #faceGo { flex:none; text-decoration:none; font-size:15px; line-height:1; padding:4px 3px; margin:-4px 0; opacity:.45; }
  /* スマホの幅では、よく使う 💡・🔇 だけを帯に出し、📋・🔔・🙂・↻ は ⋯ の中に名前つきでまとめる（2026-11-24 本人。帯が埋まると状態の文が細く折れる）。
     PC の幅では ⋯ を出さず、これまでどおり帯に並べる */
  #moreBtn { flex:none; border:none; border-radius:8px; background:none; color:var(--mute); font-size:17px; line-height:1; padding:6px 9px; margin:-6px 0; }
  #moreBtn[aria-expanded="true"] { background:#2a2a2a; color:#ddd; }
  body.wide #moreBtn { display:none; }
  body.wide #moreBox { display:contents; }
  body:not(.wide) #status { position:relative; }
  body:not(.wide) #moreBox { display:none; }
  body:not(.wide) #moreBox.open { display:flex; flex-direction:column; position:absolute; right:0; bottom:calc(100% + 8px); z-index:50; min-width:12em; padding:6px; gap:2px;
    background:#1e1e1e; border:1px solid #333; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  body:not(.wide) #moreBox > * { display:flex; align-items:center; gap:12px; width:100%; margin:0; padding:10px 12px; border:none; border-radius:8px; background:none;
    color:#ddd; font-size:17px; line-height:1; text-align:left; text-decoration:none; opacity:1; }
  body:not(.wide) #moreBox > *::after { content:attr(data-label); font-size:14px; }
  body:not(.wide) #moreBox > [hidden] { display:none; }
  body:not(.wide) #moreBox > :disabled { opacity:.35; }
  body:not(.wide) #moreBox > #tasksBtn[aria-pressed="true"] { background:#2a2f45; }
  body:not(.wide) #moreBox > #bell[aria-pressed="true"] { background:#1f4a32; }
  #reload { flex:none; border:none; background:none; color:var(--mute); font-size:16px; line-height:1; padding:4px 6px; margin:-4px -6px; } /* 目立たないように小さく、押せる広さは少し持たせる */
  /* 読み上げの切り替え。読み上げの途中でもすぐ押せるよう、↻ より押せる広さを持たせる。切っている間は色をつけて、文字だけと分かるようにする */
  #mute { flex:none; border:none; border-radius:8px; background:none; font-size:17px; line-height:1; padding:6px 9px; margin:-6px 0; opacity:.45; }
  #mute[aria-pressed="true"] { opacity:1; background:#5a1f1d; }
  /* 通知（🔔）・頼んだ件（📋）・判断待ち（💡）。🔇 と同じ大きさ。入っている・開いている間は色をつける */
  #bell, #tasksBtn, #sitBtn { flex:none; border:none; border-radius:8px; background:none; font-size:17px; line-height:1; padding:6px 9px; margin:-6px 0; opacity:.45; }
  #bell[aria-pressed="true"] { opacity:1; background:#1f4a32; }
  #tasksBtn[aria-pressed="true"] { opacity:1; background:#2a2f45; }
  #sitBtn[aria-pressed="true"] { opacity:1; background:#3a3420; }
  #sitBtn.has { opacity:1; color:#f0d98a; font-size:15px; }
  #tap, #hubStart { display:none; margin-left:auto; border:none; border-radius:8px; background:var(--ok); color:#fff; font-size:13px; padding:4px 10px; }
  /* スマホの幅では、▶ タップして再生・ハブを起動を次の行に全幅で出す（同じ行に置くと、ボタンに幅を取られて、状態の文が 2〜3 字ずつに折れて縦に伸びる） */
  body:not(.wide) #status { flex-wrap:wrap; row-gap:8px; }
  body:not(.wide) #tap, body:not(.wide) #hubStart { order:1; flex-basis:100%; margin-left:0; font-size:14px; padding:8px 10px; }
  button:disabled, input:disabled { opacity:.35; }
  .row { display:flex; gap:8px; }
  select { flex:1; min-width:0; font-size:13px; padding:8px; background:var(--btn); color:var(--fg); border:1px solid #333; border-radius:8px; }
  #agent { flex:2; }
  #talk { flex:3; height:64px; font-size:18px; border:none; border-radius:14px; background:var(--btn); color:var(--fg); }
  #talk.rec { background:var(--rec); }
  #stop { flex:1; height:64px; font-size:15px; border:none; border-radius:14px; background:var(--btn); color:var(--fg); }
  #typed { flex:1; min-width:0; font:inherit; font-size:16px; line-height:1.4; padding:9px 12px; background:var(--btn); color:var(--fg); border:1px solid #333; border-radius:10px;
    resize:none; overflow-y:auto; max-height:9.5em; box-sizing:border-box; } /* 高さは、行の数に合わせて台本が決める（fitTyped） */
  #send { width:64px; font-size:14px; border:none; border-radius:10px; background:var(--btn); color:var(--fg); }
  #attachBtn { flex:none; width:40px; font-size:18px; border:none; border-radius:10px; background:var(--btn); color:var(--fg); }
  #attachBar:not([hidden]) { display:flex; flex-wrap:wrap; gap:6px; }
  #attachBar .chip { display:inline-flex; align-items:center; gap:4px; max-width:100%; font-size:12px; color:var(--mute); border:1px solid #3a3a3a; border-radius:12px; padding:3px 4px 3px 9px; }
  #attachBar .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  #attachBar .chip button { border:none; background:none; color:inherit; font-size:12px; padding:0 4px; }
  [hidden] { display:none !important; }
  /* 承認で止まっているセッション（画面の上に並べる） */
  #asks { flex:none; max-height:45dvh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:#161616; border-bottom:1px solid #262626; }
  #asks:empty { display:none; }
  .ask { display:flex; flex-direction:column; gap:6px; padding:8px 10px; border:1px solid #5a4a1f; border-radius:10px; background:#1c1910; }
  .ask .head { font-size:13px; color:#e6c36a; }
  .ask pre { margin:0; max-height:6em; overflow:auto; font:12px/1.5 ui-monospace, Menlo, monospace; color:#ccc; white-space:pre-wrap; word-break:break-all; }
  .ask button { flex:1; height:44px; font-size:15px; border:none; border-radius:10px; color:#fff; }
  .ask .allow { background:var(--ok); } .ask .allow.warn { background:var(--rec); } .ask .deny { background:var(--btn); }
  .ask .q { font-size:14px; line-height:1.5; color:#eee; white-space:pre-wrap; word-break:break-word; max-height:9em; overflow:auto; }
  .ask .choices { display:flex; flex-direction:column; gap:6px; }
  .ask .choose { flex:none; height:auto; min-height:44px; padding:8px 12px; display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; background:var(--btn); }
  .ask .choose .desc { font-size:12px; color:#bbb; }
  .ask .choose.warn { background:var(--rec); }
  .ask .chips { font-size:12px; color:#bbb; }
  .ask .chips b { color:#e6c36a; font-weight:normal; }
  .ask .choose.on { outline:2px solid var(--ok); }
  .ask pre.pv { max-height:8em; font-size:11px; color:#ccc; background:#111; border-radius:6px; padding:4px 6px; }
  .ask .free { display:flex; gap:6px; }
  .ask .free input { flex:1; min-width:0; height:40px; font-size:14px; padding:0 8px; border-radius:8px; border:1px solid #444; background:#111; color:#eee; }
  .ask .free button { flex:none; padding:0 12px; }
  .ask .note { font-size:12px; color:#bbb; }
  .ask .send.warn { background:var(--rec); } .ask .send { background:var(--ok); }
  /* 頼んだ件（📋 で開く） */
  #tasks { flex:none; max-height:45dvh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:#14161d; border-bottom:1px solid #262a38; }
  #tasks .top { display:flex; align-items:center; font-size:13px; color:#aab4d6; }
  #tasks .top span { flex:1; }
  #tasks .top button { border:none; background:none; color:var(--mute); font-size:15px; padding:2px 6px; }
  .task { display:flex; flex-direction:column; gap:2px; padding:6px 10px; border:1px solid #2a2f45; border-radius:10px; background:#181b25; font-size:13px; }
  .task .st { font-size:12px; color:#9fb0e0; }
  .task.active .st { color:#e6c36a; } .task.done .st { color:var(--ok); } .task.bad .st { color:#e07a74; }
  .task .what, .task .note { color:#bbb; font-size:12px; overflow-wrap:anywhere; }
  /* 判断待ち（💡 で開く）: 判断待ちの受け箱と、その他（Hermes の手順の書き足し・学んだこと） */
  #situation { flex:none; max-height:55dvh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:#17150f; border-bottom:1px solid #3a3420; }
  #situation .top { display:flex; align-items:center; font-size:13px; color:#d8c88f; }
  #situation .top span { flex:1; }
  #situation .top button { border:none; background:none; color:var(--mute); font-size:15px; padding:2px 6px; }
  #sitBody { display:flex; flex-direction:column; gap:6px; }
  #sitBody h4 { margin:6px 0 0; font-size:12px; font-weight:600; color:#c9b77a; }
  .sitHead { display:flex; align-items:center; gap:8px; font-size:12px; color:#bbb; }
  .sitHead span { flex:1; }
  .sitHead button { border:none; border-radius:8px; background:#3a3420; color:var(--fg); font-size:13px; padding:5px 10px; }
  .sitMeta { color:var(--mute); font-size:12px; overflow-wrap:anywhere; }
  .sitMeta.bad { color:#e07a74; }
  .prop { display:flex; flex-direction:column; gap:4px; padding:8px 10px; border:1px solid #6b5a2a; border-radius:10px; background:#241f12; font-size:13px; }
  .prop .text { overflow-wrap:anywhere; white-space:pre-wrap; }
  .prop .risky { color:#e0a874; font-size:12px; }
  .prop .acts { display:flex; flex-wrap:wrap; gap:6px; }
  .prop .acts button { border:none; border-radius:8px; background:#3a3420; color:var(--fg); font-size:13px; padding:6px 12px; }
  .prop .acts button.go { background:#6b5a2a; }
  .prop .acts button.sure { background:#b8862e; color:#111; font-weight:600; }
  /* Hermes の手順の書き足し（承認待ち） */
  .prop.hsk { border-color:#4d5a80; background:#161b29; }
  .prop.hsk .go { background:#4d5a80; }
  pre.diff { margin:4px 0 0; max-height:40dvh; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; line-height:1.45; color:#cfd6e6; background:#0f121b; border-radius:6px; padding:6px 8px; }
  /* 差分の行の色（足した行・消した行・位置の行） */
  pre.diff span { display:block; min-height:1.45em; }
  pre.diff .add { color:#9fdcae; background:#132a1c; } pre.diff .del { color:#f0aaa4; background:#2c1717; } pre.diff .hunk { color:#8fa8dc; }
  #sitNote { font-size:12px; color:#d8c88f; overflow-wrap:anywhere; }
  #sitNote.bad { color:#e07a74; }
  #situation details summary { font-size:12px; color:#c9b77a; cursor:pointer; }
  /* 受け箱（判断待ち）。カードを押すと中身が開き、ハブとの会話はその件への「↩ 返信」になる（押しただけでは送らない） */
  .ibBand { display:flex; flex-direction:column; gap:2px; padding:7px 10px; border-radius:8px; background:#5a2a1d; color:#ffd9c7; font-size:12px; overflow-wrap:anywhere; }
  .ibBand b { font-size:13px; }
  .ibHead { display:flex; align-items:baseline; gap:8px; color:#d8c88f; font-size:12px; } .ibHead b { flex:1; font-size:14px; }
  .ibChips { display:flex; gap:6px; flex-wrap:wrap; }
  .ibChips button { border:1px solid #3a3420; border-radius:999px; background:none; color:var(--mute); font-size:12px; padding:2px 10px; }
  .ibChips button[aria-pressed="true"] { background:#3a3420; color:var(--fg); border-color:transparent; }
  .ibCard { display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; padding:8px 10px; border:1px solid #3a3420; border-radius:10px; background:#211d14; font-size:13px; cursor:pointer; }
  .ibCard.fresh { box-shadow:inset 3px 0 0 #f0d98a; }
  .ibCard .meta, .ibItem .meta, .ibFyi .meta { font-size:11px; color:var(--mute); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .ibCard .title { grid-column:1; overflow-wrap:anywhere; }
  .ibCard .done { grid-row:1 / span 2; grid-column:2; border:1px solid #6b5a2a; border-radius:8px; background:none; color:var(--fg); font-size:12px; padding:7px 11px; }
  .ibSrc { background:#2a3248; color:var(--fg); border-radius:4px; padding:0 5px; font-size:10.5px; }
  .ibTag { color:#f0d98a; }
  .ibNo { font-size:10px; opacity:.75; font-variant-numeric:tabular-nums; }  /* 記録の番号（ハブに「[番号] は…」と言うときの手がかり） */
  .ibFold > summary { font-size:12px; color:#c9b77a; cursor:pointer; padding:4px 0; }
  .ibFold > div { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .ibFyi { padding:4px 2px; font-size:12px; overflow-wrap:anywhere; border-top:1px solid #2a2618; }
  .lessonOut { margin-left:auto; border:1px solid #6b5a2a; border-radius:8px; background:none; color:var(--fg); font-size:12px; padding:2px 10px; }
  .ibToast { display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid #3a3420; border-radius:8px; background:#1d1a12; font-size:12px; overflow-wrap:anywhere; }
  .ibToast span { flex:1; } .ibToast button { border:none; background:none; color:#f0d98a; font-size:13px; text-decoration:underline; padding:2px 4px; }
  .ibItem { display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .ibBack { align-self:flex-start; border:none; background:none; color:var(--mute); font-size:12px; padding:2px 0; }
  .ibItem h3 { margin:0; font-size:15px; line-height:1.45; overflow-wrap:anywhere; }
  .ibLabel { font-size:11px; color:var(--mute); }
  .ibBox { padding:7px 10px; border:1px solid #3a3420; border-radius:8px; background:#121009; white-space:pre-wrap; overflow-wrap:anywhere; -webkit-user-select:text; user-select:text; }
  .ibActs { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .ibActs button, .ibActs a, .ibActs select { border:1px solid #6b5a2a; border-radius:8px; background:none; color:var(--fg); font-size:13px; padding:6px 12px; text-decoration:none; }
  .ibActs .go { background:#2f7d58; border-color:transparent; color:#eafff3; font-weight:600; }
  /* 済ませ方: 理由（任意）は PC の幅では丸印、スマホの幅では選ぶ欄。あとでは時刻のボタン（1 回で隠す） */
  .ibDone { display:flex; flex-direction:column; gap:6px; margin-top:4px; padding-top:8px; border-top:1px solid #2a2618; }
  .ibWhy { display:none; flex-wrap:wrap; gap:2px 12px; margin:0; padding:0; border:none; min-width:0; }
  .ibWhy legend { padding:0; margin-bottom:3px; font-size:11px; color:var(--mute); }
  .ibWhy label { display:flex; align-items:center; gap:4px; padding:2px 0; font-size:13px; white-space:nowrap; cursor:pointer; }
  .ibWhy input { margin:0; accent-color:#2f7d58; cursor:pointer; }
  body.wide .ibWhy { display:flex; } body.wide .ibWhySel, body.wide .ibWhyNote { display:none; }
  .ibLaterRow { padding-top:8px; border-top:1px solid #2a2618; } .ibLaterRow .ibLabel { font-size:12px; margin-right:2px; }
  .ibNote { font-size:11px; color:var(--mute); overflow-wrap:anywhere; }
  /* PC（横幅 1100px 以上で body に wide）。3 列: 左にセッションの一覧と頼んだ件、真ん中に会話、右に記録（記憶・判断待ち）。スマホの幅では何も変えない。
     左の縦の色の帯は状態を表す（セッション・頼んだ件・承認のカードで同じ色）: 黄＝あなた待ち、青＝動いている、緑＝終わった、赤＝切れた・失敗、灰＝それ以外。
     箱で囲むのは押して決めるもの（承認・手順の書き足し）だけにして、一覧は線で区切る */
  #side, #rec { display:none; }
  body.wide {
    --w-bg:#121316; --w-col:#17181b; --w-hover:#1d1f23; --w-sel:#25282e; --w-rule:#272a2f; --w-field:#1b1d21; --w-line:#363a41;

  /* 頼んだ件。指示の文は 2 行で切り、押すと全文 */

  /* 記憶。字数は上限との棒でも出す（8 割で黄、95% で赤）。長い項目は 4 行で切り、直す・消すはマウスを載せた項目だけに出す */

  }

  /* 成果物: 返事に出てきた画像・動画のサムネイル（PC の幅だけ）。押すと #viewer で大きく見る。Markdown の画像は、その場では文字（.mref）にする */

  /* ---------- 顔の表示（/?face。スマホを仮のスタックチャンにする） ----------
     機械の画面に寄せて、黒い地に目と口だけ。状態は表情で示し、承認・判断待ちがあるときは縁を琥珀色に光らせる。色はこの表示だけの一つの見た目 */

    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); cursor:pointer;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }

  #face .mouth { stroke:#f4f4f4; stroke-width:7; stroke-linecap:round; fill:none; transition:opacity .15s; }
  #face .mouthO { fill:#f4f4f4; opacity:0; transform-box:fill-box; transform-origin:center; }
  @keyframes faceBlink { 0%,93%,100% { transform:scaleY(1) } 95% { transform:scaleY(.08) } }
  @keyframes faceTalk { 0%,100% { transform:scaleY(.35) } 50% { transform:scaleY(1) } }
  @keyframes faceThink { 0%,100% { transform:translate(-6px,-10px) } 50% { transform:translate(6px,-10px) } }
  #face[data-s="listen"] .eye { transform:scale(1.15); animation:none; }
  #face[data-s="listen"] .mouth, #face[data-s="speak"] .mouth { opacity:0; }
  #face[data-s="listen"] .mouthO { opacity:1; transform:scale(.55); }

  /* 押したのが届いた印（止めた）。縁を白く一瞬光らせる（届いたか分からないと、もう一度押してしまう。R12） */

    c.classList.add('editing');
    const ed = memEdits.get(e.v), ta = node('textarea'); ta.value = ed.text; ta.oninput = () => { ed.text = ta.value; };
    const row = node('div', 'acts'), save = node('button', 'go', '保存'), cancel = node('button', null, 'やめる');
    cancel.onclick = () => { memEdits.delete(e.v); drawMemory(); };
    save.onclick = async () => {
      save.disabled = cancel.disabled = true; save.textContent = '保存しています…';
      await memWrite('edit', { target: t, v: e.v, content: ed.text }, '直しました', () => memEdits.delete(e.v));

// ---------- 通信 ----------
// 本体に届かない間は案内を出してつなぎ直し続け、届いたらページを読み込み直さずに、その場で一覧・声・会話を取り直す。
// 案内は届かない先を名指ししない（本体が Mac とは限らない）
const UNREACHABLE = '接続できません。接続を確かめてください';

  ws.onopen = () => {

    heardId = -1; stopGen = -1; // つなぎ直したら、前の接続の返事の番号・停止の回数は使わない（名乗りの返事で取り直す）
    if (away || !agentsSig || !$('speaker').options.length || pendingTopic) { away = false; catchUp(); } // 起動時に読めなかったもの（開けなかった件も）を取り直す
  };

  };

    if (ev.data instanceof ArrayBuffer) { enqueue(ev.data); return; }

    if (m.type === 'status') setStatus(m.text);
    else if (m.type === 'transcript') { if (here) { bubble('me', m.text, 'pending'); localPush('me', m.text); } setStatus('エージェントに送りました。考え中…'); }
    else if (m.type === 'reply') {
      if (here && typeof m.hid === 'number') heardId = m.hid; // いまの相手のハブの返事を受け取った
      if (!here) { if (m.report) sys(A('ハブから報告が届きました: ') + m.about + (m.saved === false ? A('（記録に書けなかったので、ハブの履歴には出ません）') : A('（ハブを選ぶと読めます）'))); return; } // report = 頼んだ件についての、ハブからの自発的な報告
      if (m.saved === false) { bubble('ai', m.text); sys('⚠ このやり取りは記録に書けませんでした（開き直すと消えます。本体のログを見てください）'); } // 描き直すと消えるので、そのまま足す
      else {
        await loadThread(); // 記録から描き直す（新しいセッションは、この時点で初めて記録ができている）
        if (threadSource === 'none') { bubble('ai', m.text); localPush('ai', m.text); }
      }

};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {}); // Mac に届かなくても画面は開けるように（sw.js）
preparePush(); // 通知（🔔）の用意。sw.js が動きだしてから
setInterval(() => { if (!document.hidden) hello(); }, 20000); // 見えている間は知らせ直す（裏に回ったことが届かなくても、本体は45秒で見えていないとみなす）
window.addEventListener('pagehide', () => hello(false)); // 閉じる・裏に回るときに「見えていない」を知らせる
document.addEventListener('visibilitychange', () => { hello(); if (!document.hidden) { connect(); ensureSpeakers(); loadAgents().then(() => { if ($('agent').value) loadThread(); }); } });
window.addEventListener('online', () => connect());
setInterval(() => { if (!document.hidden && document.activeElement !== $('agent')) { loadAgents(); ensureSpeakers(); } }, 20000);
setInterval(() => { if (!document.hidden) loadAsks(); }, 5000); // 承認で止まっているセッションを、話し相手の画面のまま上に並べる
loadAsks();
// 一覧と声を読んでからつなぐ。届かないときは5秒で見切って案内を出し、つなぎに行く（つながりしだい catchUp で取り直す）
// 件の URL（通知・Slack のリンク）で新しく開いたときは、起動の読み込み（一覧・会話・声）を待たずに件を開く（初めの表示では hashchange が起きない。
// 届かなければ、件を覚えておき catchUp と少し待ってから開き直す）
if (location.hash && !openInboxHash()) openTopic();
Promise.race([Promise.allSettled([loadAgents(), ensureSpeakers()]).then(() => true), new Promise(r => setTimeout(() => r(false), 5000))])
  .then(replied => { if (!replied) setStatus(UNREACHABLE); connect(); });

// ---------- 顔の表示（/?face） ----------
// 表情: idle（ふつう）・listen（聞いている）・think（考えている）・speak（話している）・offline（つながっていない）。顔をタップすると「タップして話す」と同じ
// 表情の優先: つながっていない ＞ 録音中（聞いている）＞ 頼まれた表情。再生の始まり・終わり・停止・失敗の知らせが、
// 切断や録音中の顔を上書きしないように（顔の表示では録音のボタンが隠れているので、録音中だと分からなくなる。codex-review c62083a・04b0694）
function face(s) { if (FACE) $('face').dataset.s = !linked() ? 'offline' : rec && rec.state === 'recording' ? 'listen' : s; }
// 顔を押して止めたとき、届いた印（縁を白く一瞬）は、本体が止めたと返してから光らせる
let faceAckWait = false;
function faceAck() { if (!FACE) return; const f = $('face'); f.classList.remove('ack'); void f.offsetWidth; f.classList.add('ack'); setTimeout(() => f.classList.remove('ack'), 600); }
// 縁の琥珀色: 急ぎ。承認・入力待ちがあるか、代理（Hermes）からの新しい知らせをまだ聞いていないとき。顔の表示では受け箱が見えず、
// 画面が見えている扱いでプッシュ通知も止まるので、知らせは顔で示す（codex-review b7a7b3f）。顔をタップしたら聞いたことにする。
// たまっている判断待ちの数は、縁ではなく左上の「💡 数」で示す（1 日に何件も届き、片づくまで長いので、縁を光らせ続けると急ぎが分からなくなる）
let faceAsks = 0, faceUnheard = false;
function faceAttn() { if (FACE) $('face').classList.toggle('attn', faceOn && (faceAsks > 0 || faceUnheard)); }
function faceNotice(m) {
  if (!faceOn) return;
  faceUnheard = true; faceAttn();
  $('faceCap').textContent = '💡 ' + ((m && m.title) ? String(m.title).slice(0, 60) : '代理からの知らせが届きました') + '（タップして「何？」と聞いてください）';
}
if (FACE) {
  $('face').hidden = false; applyInert(); // 裏の画面は、顔を閉じるまで操作できない
  // 画面を消さない許可（Wake Lock）。一度タップしたあとは、画面に戻るたびに取り直す（ほかのアプリへ移ると、ブラウザが外すため）。
  // 頼んでいる途中の分は 1 つだけ（重ねると、閉じたあとにも 1 つ残る。codex-review 0b06aa8）
  let wake = null, wakeAsking = false, wantWake = false;
  const askWake = () => {
    if (wake || wakeAsking || !faceOn || !navigator.wakeLock) return;
    wakeAsking = true;
    try {
      navigator.wakeLock.request('screen').then(w => {
        wakeAsking = false;
        if (!faceOn || wake) { w.release().catch(() => {}); return; } // 頼んでいる間に顔を閉じた・もう持っているなら、すぐ手放す
        wake = w; w.addEventListener('release', () => { if (wake === w) wake = null; });
      }).catch(() => { wakeAsking = false; });
    } catch { wakeAsking = false; }
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && wantWake) askWake(); });
  const tapAct = () => {
    if (rec && rec.state === 'recording') { $('talk').click(); return; } // 録音中は、まず録音を止めて送る（再生のタップ待ちより先。codex-review dc4b0b9）
    const s = $('face').dataset.s;
    if (s === 'think' || s === 'speak') { faceAckWait = true; $('stop').click(); return; } // 考えている・話しているときに押したら止める（録音は始めない。もう一度押すと話せる。R12・2026-11-24）。再生のタップ待ちより先
    if ($('tap').style.display === 'inline-block') { $('tap').click(); return; } // 再生にタップが要るとき（自動の再生を断られた）は、録音ではなく再生を始める（codex-review 779f0c2）
    if ($('talk').disabled) { $('faceCap').textContent = 'いまは話せません（' + ($('statusText').textContent || '準備中') + '）'; return; } // 黙って何もしないと、壊れたように見える
    $('talk').click();
  };
  const tapFace = e => {
    if (e.target.closest('#faceBack')) return;
    faceUnheard = false; faceAttn(); // 知らせはタップで聞いたことにする（縁は承認・入力待ちがあれば残る）
    tapAct(); // 先に押す（録音と再生の準備は、タップの中で始める必要がある）
    wantWake = true; askWake(); // どの押し方でも頼む（録音せずに報告を聞くだけの使い方でも、画面が消えないように）
  };
  // 顔を閉じる。読み込み直さないので、開いた件・会話・録音はそのまま（URL の ?face だけを外す）。名乗りも画面に戻す
  const closeFace = () => {
    if (!faceOn) return;
    faceOn = false; $('face').hidden = true; applyInert(); faceAttn();
    if (rec && rec.state === 'recording') stopRec(); // 顔で録っていた声は送らない（録音の終わりで、表示が切り替わったのを見て捨てる）。マイクも離す
    wantWake = false; if (wake) { const w = wake; wake = null; w.release().catch(() => {}); } // ふだんの画面では眠れるように、許可を手放す（頼んでいる途中の分は、届いたら手放す。codex-review bc775f6）
    try { history.replaceState(null, '', location.pathname + location.hash); } catch {}
    hello(); applyTarget(); // ハブが居ないときの案内から「画面に戻る」を外す
  };
  $('faceBack').addEventListener('click', e => { e.preventDefault(); closeFace(); });
  // 通知・リンクで件・受け箱・判断待ちを開いたら、顔を閉じて中身を見せる（顔の裏に隠れないように。codex-review dc4b0b9）
  // 場所は、変わった先の URL で見る（受け箱の処理が先に動いて、場所を消すことがあるため）
  window.addEventListener('hashchange', e => { let h = ''; try { h = new URL(e.newURL).hash; } catch {} if (/^#(t=|inbox|i=)/.test(h)) closeFace(); });
  $('face').addEventListener('click', tapFace);
  if (/^#(t=|inbox|i=)/.test(FACE_HASH)) closeFace(); // 件・受け箱・判断待ちの場所つきで開いたときも、顔を閉じて中身を見せる（最初の表示では hashchange が起きない）
  $('face').addEventListener('keydown', e => {
    if (e.target.closest('#faceBack')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) tapFace(e); } // 戻るリンクの Enter は止めない。長押しの繰り返しでは押さない（codex-review b5a95ff）
    else if (e.key === 'Escape') { // 机の顔（PC の 3 列の幅でない窓）でも Esc で止める。考えている・話しているときだけ（録音中に止めたと出して、録音を続けない）
      e.preventDefault(); e.stopPropagation(); // 画面全体の Esc（停止）にも回さない
      const s = $('face').dataset.s;
      if (!e.repeat && (s === 'think' || s === 'speak')) { faceAckWait = true; $('stop').click(); }
    }
  });
  face('idle');
}
</script>
</body>
</html>
