name: code-review
# PR ごとのコードレビュー（公式の code-review プラグイン）。security-review と同じ条件・同じ隔離で動かす
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.id == 6554937 &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Claude の子プロセスを隔離する道具を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            この実行環境での補足:
            - 手順 1 の「Claude がすでにコメントしている」は、本文が「## Code review」で始まるコメントだけを数える。github-actions の「指摘なし」などは別の検査のコメントなので数えない
            - `docs/decisions.md` に記録された判断の範囲内のものは指摘しない。範囲を超えるものは、超えていることを書いて指摘する
            - 公開リポジトリなので、攻撃の具体的な手順は書かない
          claude_args: >-
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(grep:*),Bash(rg:*),Read,Grep,Glob,Agent,Task,mcp__github_inline_comment__create_inline_comment"
            --max-turns 60
      - name: 実行の構造（使った道具の種類と、読んだファイルの名前だけ。本文は出さない）
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          WS: ${{ github.workspace }}
        run: |
          [ -f "$EXEC" ] || { echo "execution_file なし"; exit 0; }
          jq -r --arg ws "$WS/" '
            def tally: group_by(.) | map("\(.[0])=\(length)") | join(" ");
            ([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use")]) as $uses
            | "tools: \($uses | map(.name) | tally)",
              "read: \($uses | map(select(.name == "Read") | .input.file_path // "" | ltrimstr($ws)) | unique | join(" "))",
              "bash: \($uses | map(select(.name == "Bash") | .input.command // "" | split(" ")[0:2] | join(" ")) | tally)",
              "result: \([.[] | select(.type == "result") | {turns: .num_turns, ms: .duration_ms, usd: .total_cost_usd, denied: (.permission_denials | length)}][0])"
          ' "$EXEC"
