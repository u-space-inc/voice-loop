name: semgrep
# 正本: 設計ノートの assets/security-workflows/semgrep.yml（2026-11-05 v2）
# 各リポジトリはこのファイルをそのまま写す（差分なし）。public/private の違いは if で吸収する
# actions は commit SHA、image は digest で固定。更新は正本から
on:
  schedule:
    - cron: "0 0 * * 1"      # 毎週月曜 09:00 JST
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/semgrep.yml   # この workflow 自身を変えた PR だけ（マージ前に試すため）
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0   # 2026-10-29 公開
    permissions:
      contents: read
      security-events: write   # public の upload-sarif 用。private では使われない
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # LLM を使わない基準線。ソースは送られず、--metrics off で利用統計も送らない（--config auto は metrics を要するので使わない）
      # 指摘があっても exit 0（--error を付けない）。schedule なので PR も塞がない
      - run: semgrep scan --config p/ci --sarif --output semgrep.sarif --metrics off
      # private: SARIF を artifact に保存（Code Security 未購入で code scanning に上げられないため）。90 日
      # public: artifact はログインした誰でも落とせるので残さず、code scanning にだけ上げる（CodeQL と同じ画面で見比べる）
      - if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif-${{ github.run_id }}
          path: semgrep.sarif
          retention-days: 90
      - if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
