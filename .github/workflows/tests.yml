name: tests
# spike/ の試験のうち、spike/ci.txt で CI に載せたもの（常駐の 8790・本物の herdr・コンテナ・Hermes・外のサービスに触れないもの）を、
# 上から 1 本ずつ順に回す。どれかが落ちたら、最後に落ちた試験の名前を並べて失敗にする（途中で止めず、全部の結果を残す）。
# 鍵（secrets）は使わない。権限は読むだけ。actions は commit SHA で固定する（版の札は書き換えられうる）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
# 同じ PR・同じ枝で続いたら、前の run を取り消して後の run を回す
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  spike:
    # 本体は macOS 向け（herdr のプラグインの platforms）。公開リポジトリでは標準の実行環境は無料
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # uv は lock と pyproject が食い違えば失敗する（uv run が lock の外で依存を解き直さない。a2a 35d3b740 の指摘）
      UV_LOCKED: "1"
      # 本体（常駐）と同じ Python で回す（手元の .venv は 3.12）。指定しないと、実行環境の新しい python3 が選ばれる
      UV_PYTHON: "3.12"
      # 二重の守り: 試験が行き先を指定し忘れても、本体の既定の行き先（声のエンジン・聞き取り・Hermes・語り手）は
      # 何も待ち受けていないポートを指し、設定・状態・Hermes の置き場は一時のフォルダになる（最初の段で設定。各試験が自分で指定したものが先に効く）
      VL_VOICE_URL: http://127.0.0.1:9
      VL_WHISPER: http://127.0.0.1:9/v1/audio/transcriptions
      VL_HERMES_URL: http://127.0.0.1:9
      ANTHROPIC_BASE_URL: http://127.0.0.1:9
    steps:
      - name: 設定・状態・Hermes の置き場を一時のフォルダにする（runner.temp はジョブの env では使えない）
        run: |
          {
            echo "VL_CONFIG_DIR=$RUNNER_TEMP/vl-config"
            echo "VL_STATE_DIR=$RUNNER_TEMP/vl-state"
            echo "VL_HERMES_HOME=$RUNNER_TEMP/vl-hermes"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: uv を入れる（手元と同じ版に固定）
        run: pipx install uv==0.13.4
      - name: 依存を入れる（uv.lock のとおり。作業木の .venv）
        run: uv sync --locked
      - name: ffmpeg を入れる（機械に返す声を Opus に縮める試験が使う）
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - name: ブラウザを入れる（pyproject.toml の Playwright の版に合わせる）
        run: uv run playwright install chromium webkit
      - name: 試験を 1 本ずつ回す（spike/ci.txt）
        run: |
          set -u
          # 先に一覧を読み切る（最後の行に改行が無くても読む。試験が標準入力を読んでも、残りの試験を飛ばさない。a2a 35d3b740 の指摘）
          tests=()
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*|'- '*) continue ;; esac
            tests+=("$line")
          done < spike/ci.txt
          if [ "${#tests[@]}" -eq 0 ]; then echo "::error::spike/ci.txt に回す試験がない"; exit 1; fi
          echo "回す試験: ${#tests[@]} 本"
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if uv run "spike/$t" < /dev/null; then echo "→ 通った: $t"; else echo "::error::落ちた: $t"; failed+=("$t"); fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '落ちた試験: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "spike/ci.txt の ${#tests[@]} 本はすべて通った"
